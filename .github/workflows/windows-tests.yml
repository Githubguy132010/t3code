# Disposable PR #2 override on feature/upstash-cloud-pilot only. Never merge.
# The original manual workflow remains unchanged on main.
name: Disposable cloud pilot execution
on:
  workflow_dispatch:
    inputs:
      activation:
        description: Confirm free quota, scoped token, user OAuth sharing, and 30 minutes including setup
        required: true
        type: choice
        options:
          - NOT_APPROVED
          - APPROVED_ZERO_EXTRA_30_MIN
      spec:
        description: JSON repository, baseBranch, baseSha, providerInstanceId, instruction, requiredChecks
        required: true
        type: string
      runtime_mode:
        required: true
        type: choice
        options:
          - approval-required
          - auto-accept-edits
permissions:
  contents: read
  actions: write
concurrency:
  group: disposable-cloud-pilot
  cancel-in-progress: false
jobs:
  build:
    # Live activation requires a separately approved code change; variables alone cannot enable it.
    if: false && github.repository == 'Githubguy132010/t3code' && github.event.repository.private == false && vars.T3_PILOT_ENABLED == 'true' && github.sha == vars.T3_PILOT_APPROVED_HEAD && inputs.activation == 'APPROVED_ZERO_EXTRA_30_MIN'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - run: |
          npm install --global pnpm@11.10.0
          pnpm install --frozen-lockfile --ignore-scripts --filter t3... --filter @t3tools/web... --filter @t3tools/client-runtime... --filter @t3tools/oxlint-plugin-t3code... --filter @t3tools/scripts...
          (cd apps/web && ../../node_modules/.bin/vp build)
          (cd apps/server && ../../node_modules/.bin/vp pack)
      - id: pack
        run: bash scripts/cloud-pilot/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-runtime
          path: pilot-runtime.tgz
          retention-days: 1
  execute:
    if: false
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bounded remote task
        env:
          T3_PILOT_ACTIVATION: ${{ inputs.activation }}
          T3_PILOT_BOX_ID: ${{ vars.T3_PILOT_BOX_ID }}
          T3_PILOT_APPROVED_REPOSITORY: ${{ vars.T3_PILOT_APPROVED_REPOSITORY }}
          T3_PILOT_BOX_API_KEY: ${{ secrets.T3_PILOT_BOX_API_KEY }}
          T3_PILOT_REPO_TOKEN: ${{ secrets.T3_PILOT_REPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PILOT_SPEC: ${{ inputs.spec }}
          PILOT_RUNTIME_MODE: ${{ inputs.runtime_mode }}
          PILOT_ARTIFACT_SHA256: ${{ needs.build.outputs.digest }}
        run: python3 scripts/cloud-pilot/controller.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-${{ github.run_id }}
          path: receipt.json
          retention-days: 7
