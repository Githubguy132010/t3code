name: Disposable cloud pilot watchdog
run-name: pilot-watchdog-${{ inputs.controller_run }}
on:
  workflow_dispatch:
    inputs:
      controller_run:
        required: true
        type: string
      deadline:
        required: true
        type: string
      box_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  watch:
    # Live activation requires a separately approved code change; variables alone cannot enable it.
    if: false && github.repository == 'Githubguy132010/t3code' && github.event.repository.private == false && vars.T3_PILOT_ENABLED == 'true' && github.sha == vars.T3_PILOT_APPROVED_HEAD && inputs.box_id == vars.T3_PILOT_BOX_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      T3_PILOT_ACTIVATION: APPROVED_ZERO_EXTRA_30_MIN
      T3_PILOT_BOX_ID: ${{ vars.T3_PILOT_BOX_ID }}
      T3_PILOT_BOX_API_KEY: ${{ secrets.T3_PILOT_BOX_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PILOT_CONTROLLER_RUN: ${{ inputs.controller_run }}
      PILOT_DEADLINE: ${{ inputs.deadline }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 scripts/cloud-pilot/controller.py watchdog-ready
      - uses: actions/upload-artifact@v4
        with:
          name: watchdog-ready-${{ inputs.controller_run }}
          path: watchdog-ready.json
          retention-days: 1
      - run: python3 scripts/cloud-pilot/controller.py watchdog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-${{ inputs.controller_run }}
          path: cleanup.json
          retention-days: 7
