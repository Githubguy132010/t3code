name: Kilo provider checks

on:
  pull_request:
    paths:
      - .github/workflows/kilo-provider.yml
      - apps/server/src/provider/kilo/**
      - apps/server/src/provider/Drivers/Kilo*Driver.ts
      - apps/server/src/provider/builtInDrivers.ts
      - apps/server/src/orchestration-v2/**
      - apps/server/src/textGeneration/KiloTextGeneration.ts
      - apps/server/scripts/kilo-stream-benchmark.mjs
      - apps/desktop/scripts/kilo-ui-evidence.mjs
      - apps/web/src/components/**
      - apps/mobile/src/**
      - packages/contracts/src/**
      - packages/client-runtime/**
      - third-party-licenses.config.json
      - knip.jsonc
      - apps/server/package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: kilo-provider-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provider-integration:
    # The upstream suite uses Blacksmith runners unavailable to this fork.
    # Reassess this workflow before proposing the provider upstream.
    # The owner's former login redirects; the repository ID survives that rename.
    if: github.repository_id == '1286185343'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          # Verify the exact PR head rather than an implicit merge commit.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install the pinned local Kilo CLI
        run: npm install --prefix "$RUNNER_TEMP/kilo-probe" --ignore-scripts @kilocode/cli@7.8.3

      - name: Lint changed provider and client code
        run: >-
          vp lint apps/server/src/provider/kilo
          apps/server/src/provider/Drivers/KiloDriver.ts
          apps/server/src/provider/Drivers/KiloCloudDriver.ts
          apps/server/src/orchestration-v2/Adapters/KiloCloudAdapterV2.ts
          apps/server/src/orchestration-v2/Adapters/KiloCloudAdapterV2.test.ts
          apps/server/src/orchestration-v2/Adapters/KiloCloudAdapterV2.live.test.ts
          apps/server/src/orchestration-v2/Adapters/KiloAdapterV2.ts
          apps/server/src/orchestration-v2/Adapters/KiloAdapterV2.live.test.ts
          apps/server/src/textGeneration/KiloTextGeneration.ts
          apps/server/scripts/kilo-stream-benchmark.mjs
          apps/desktop/scripts/kilo-ui-evidence.mjs
          apps/web/src/components/Icons.tsx
          apps/web/src/components/chat/ProviderInstanceIcon.tsx
          apps/web/src/components/settings/providerDriverMeta.ts
          packages/client-runtime/src/kiloIcon.ts
          packages/contracts/src/settings.ts
          packages/contracts/src/orchestrationV2.ts --deny-warnings

      - name: Lint mobile changes
        run: vp lint apps/mobile/src/components/ProviderIcon.tsx apps/mobile/src/features/settings/SettingsProviderAccountsRouteScreen.tsx

      - name: Check changed workspace types
        run: |
          vp exec tsc --noEmit -p apps/server
          vp exec tsc --noEmit -p apps/web
          vp exec tsc --noEmit -p apps/mobile
          vp exec tsc --noEmit -p packages/contracts
          vp exec tsc --noEmit -p packages/client-runtime

      - name: Check server dependencies and exports
        run: vp exec knip --workspace apps/server --workspace apps/web --workspace packages/contracts --workspace packages/client-runtime --include files,dependencies,exports --preprocessor ./scripts/knip-schemas.ts --no-config-hints

      - name: Check mobile files and dependencies
        run: vp exec knip --workspace apps/mobile --include files,dependencies --no-config-hints

      - name: Test native Kilo sessions and OpenCode regressions
        env:
          KILO_BIN: ${{ runner.temp }}/kilo-probe/node_modules/.bin/kilo
          KILO_TEST_ROOT: ${{ runner.temp }}
        run: >-
          vp test run --no-file-parallelism
          apps/server/src/provider/kilo
          apps/server/src/orchestration-v2/Adapters/KiloAdapterV2.live.test.ts
          apps/server/src/orchestration-v2/Adapters/KiloCloudAdapterV2.test.ts
          apps/server/src/orchestration-v2/ProviderRuntimeRecoveryService.test.ts
          apps/server/src/orchestration-v2/ProviderSessionManager.test.ts
          apps/server/src/orchestration-v2/ProviderTurnStartService.test.ts
          apps/server/src/orchestration-v2/ProviderTurnControlService.test.ts
          apps/server/src/orchestration-v2/RunExecutionService.test.ts
          apps/server/src/orchestration-v2/Adapters/OpenCodeAdapterV2.test.ts
          apps/server/src/provider/opencodeRuntime.environment.test.ts
          apps/server/src/provider/opencodeRuntime.permissions.test.ts
          apps/server/src/provider/Drivers/OpenCodeDriver.test.ts

      - name: Build the server bundle
        run: vp run --filter t3 build:bundle

      - name: Build web and desktop bundles
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsecret-1-dev
          # The desktop build includes its web and server dependencies.
          vp run --filter @t3tools/desktop build

      - name: Export the Android JavaScript bundle
        working-directory: apps/mobile
        env:
          APP_VARIANT: development
        run: vp exec expo export --platform android --output-dir "$RUNNER_TEMP/kilo-android"

      - name: Install Chromium for the authorized UI check
        run: node apps/desktop/node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Exercise the real UI with local inference
        env:
          KILO_BIN: ${{ runner.temp }}/kilo-probe/node_modules/.bin/kilo
          KILO_EVIDENCE_DIR: ${{ runner.temp }}/kilo-evidence
        run: node apps/desktop/scripts/kilo-ui-evidence.mjs

      - name: Compare equivalent stream workloads against the unchanged SDK layer
        run: |
          mkdir -p "$RUNNER_TEMP/kilo-baseline" "$RUNNER_TEMP/kilo-evidence"
          git fetch --no-tags --depth=1 origin dfa68127e1a4a992b4184babe0e193432465bdd2
          git show dfa68127e1a4a992b4184babe0e193432465bdd2:apps/server/src/provider/kilo/KiloSessionClient.ts > "$RUNNER_TEMP/kilo-baseline/KiloSessionClient.ts"
          ln -s "$GITHUB_WORKSPACE/apps/server/node_modules" "$RUNNER_TEMP/kilo-baseline/node_modules"
          node --expose-gc apps/server/scripts/kilo-stream-benchmark.mjs "$RUNNER_TEMP/kilo-baseline/KiloSessionClient.ts" > "$RUNNER_TEMP/kilo-evidence/stream-benchmark.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kilo-ui-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/kilo-evidence
          if-no-files-found: warn
          retention-days: 14
